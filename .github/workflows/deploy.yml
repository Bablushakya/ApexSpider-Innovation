name: Submit IndexNow (Bing)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    name: Submit IndexNow (Bing)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - name: Wait for site to be reachable
        run: |
          echo "Waiting for site to be reachable with HTTP 200..."
          curl -s -f -o /dev/null \
            --retry 10 \
            --retry-delay 5 \
            --retry-all-errors \
            --max-time 30 \
            https://www.apexspiderinnovation.com/
          echo "Site is reachable with HTTP 200."

      - name: Trigger IndexNow submission
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/indexnow_response.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEXNOW_TRIGGER_SECRET }}" \
            -H "Content-Type: application/json" \
            https://www.apexspiderinnovation.com/api/indexnow)
          echo "IndexNow endpoint responded with HTTP $HTTP_STATUS"
          echo "Response body:"
          cat /tmp/indexnow_response.txt
          echo ""
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "IndexNow submission triggered successfully."
          else
            echo "IndexNow submission returned HTTP $HTTP_STATUS — check Vercel logs."
            exit 1
          fi
